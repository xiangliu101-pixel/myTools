<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>文本工具箱 · 分割｜合并｜批量编辑</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #059669;
            --primary-hover: #047857;
            --primary-light: #ecfdf5;
            --primary-border: #a7f3d0;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-focus: #10b981;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.1);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --danger-light: #fef2f2;
            --warning: #d97706;
            --warning-light: #fffbeb;
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Roboto Mono', monospace;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --toast-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            font-family: var(--font-sans);
            color: var(--text);
            padding: 24px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image:
                radial-gradient(ellipse at 10% 0%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 100%, rgba(16, 185, 129, 0.04) 0%, transparent 50%);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ==== 卡片设计 ==== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: 28px 32px;
            margin-bottom: 24px;
            transition: box-shadow var(--transition);
            border: 1px solid rgba(226, 232, 240, 0.6);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7, #34d399, #10b981);
            background-size: 200% 100%;
            animation: shimmer 4s ease-in-out infinite;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #065f46, #059669, #10b981);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 16px;
            font-size: 1.5rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
            flex-shrink: 0;
        }

        .sub {
            color: var(--text-secondary);
            border-left: 4px solid #10b981;
            padding-left: 14px;
            margin: 16px 0 24px 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .sub .tag {
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 8px;
            letter-spacing: 0.3px;
        }

        /* ==== Tabs样式 ==== */
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 28px;
            flex-wrap: wrap;
            position: relative;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 16px 16px 0 0;
            transition: all var(--transition);
            color: var(--text-secondary);
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .tab-btn .tab-icon {
            font-size: 1.1rem;
            transition: transform var(--transition);
        }
        .tab-btn:hover {
            color: var(--primary);
            background: rgba(16, 185, 129, 0.05);
            border-radius: 16px 16px 0 0;
        }
        .tab-btn:hover .tab-icon {
            transform: scale(1.2);
        }
        .tab-btn.active {
            color: var(--primary);
            background: var(--primary-light);
            border-radius: 16px 16px 0 0;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 24px;
            right: 24px;
            height: 3px;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 3px 3px 0 0;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scaleX(0.3);
            }
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        .tab-pane {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .tab-pane.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==== 表单元素 ==== */
        label {
            font-weight: 600;
            color: var(--text);
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        label .label-icon {
            font-size: 1rem;
        }

        textarea,
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: #fafcfe;
            transition: all var(--transition);
            resize: vertical;
            color: var(--text);
            line-height: 1.6;
        }

        textarea:hover,
        input[type="text"]:hover {
            border-color: #cbd5e1;
            background: #ffffff;
        }
        textarea:focus,
        input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12), 0 2px 12px rgba(16, 185, 129, 0.08);
            background: #ffffff;
        }
        textarea::placeholder,
        input::placeholder {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .row-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 8px;
            align-items: flex-start;
        }
        .col {
            flex: 1;
            min-width: 180px;
        }

        /* ==== 快捷按钮 ==== */
        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            align-items: center;
        }
        .quick-btns .quick-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .quick-btn {
            background: #f1f5f9;
            border: 1.5px solid transparent;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: #475569;
            transition: all var(--transition);
            letter-spacing: 0.2px;
            font-family: var(--font-sans);
        }
        .quick-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary-border);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.15);
        }
        .quick-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* ==== 复选框 ==== */
        .check-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin: 10px 0 4px 0;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            user-select: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .check-item:hover {
            color: var(--text);
            background: rgba(16, 185, 129, 0.04);
        }
        .check-item input[type="checkbox"] {
            width: 17px;
            height: 17px;
            border-radius: 5px;
            border: 2px solid #cbd5e1;
            cursor: pointer;
            accent-color: var(--primary);
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .check-item input[type="checkbox"]:hover {
            border-color: var(--primary);
        }
        .check-item input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* ==== 按钮 ==== */
        button.primary {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
            font-family: var(--font-sans);
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        button.primary::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        button.primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }
        button.primary:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25);
        }
        button.primary:active::after {
            width: 300px;
            height: 300px;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .secondary-btn {
            background: #ffffff;
            border: 1.5px solid #d1d5db;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.8rem;
            color: #374151;
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .secondary-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .secondary-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }
        .secondary-btn.copied {
            background: var(--primary-light);
            border-color: var(--primary-border);
            color: var(--primary);
            animation: pulse 0.5s ease;
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        .secondary-btn.danger-btn {
            background: #ffffff;
            border-color: #fca5a5;
            color: var(--danger);
        }
        .secondary-btn.danger-btn:hover {
            background: var(--danger-light);
            border-color: #ef4444;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.12);
        }

        /* ==== 结果区 ==== */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
            gap: 10px;
        }
        .result-header .label-text {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats {
            background: var(--primary-light);
            border-radius: 40px;
            padding: 5px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            transition: all var(--transition);
            letter-spacing: 0.3px;
            border: 1px solid var(--primary-border);
        }

        .result-area {
            background: #fefefc;
            border: 1.5px solid #e9edf2;
            border-radius: var(--radius-md);
            padding: 18px 20px;
            max-height: 380px;
            overflow: auto;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            transition: all var(--transition);
            position: relative;
        }
        .result-area:hover {
            border-color: #d1d5db;
        }
        .result-area pre {
            margin: 0;
            font-family: inherit;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.82rem;
        }
        .result-area::-webkit-scrollbar {
            width: 6px;
        }
        .result-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .result-area::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }
        .result-area::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* ==== 批量编辑控件 ==== */
        .batch-ctrl-group {
            background: #fafcfe;
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin-bottom: 16px;
            border: 1.5px solid #eef2f8;
            transition: all var(--transition);
        }
        .batch-ctrl-group:hover {
            border-color: #dce5ef;
            box-shadow: var(--shadow-sm);
        }
        .batch-ctrl-group .group-title {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 10px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }
        .batch-ctrl-group .group-title .group-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .batch-ctrl-group .group-title .badge-green {
            background: var(--primary-light);
            color: var(--primary);
        }
        .batch-ctrl-group .group-title .badge-red {
            background: var(--danger-light);
            color: var(--danger);
        }

        .inline-input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .inline-input-group .field {
            flex: 2;
            min-width: 160px;
        }
        .inline-input-group .field input {
            padding: 10px 16px;
            font-size: 0.85rem;
            border-radius: var(--radius-sm);
        }
        .inline-input-group .action-btn {
            flex: 0 0 auto;
        }
        .inline-input-group .action-btn button {
            padding: 10px 22px;
            font-size: 0.8rem;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 0.2px;
            font-family: var(--font-sans);
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-apply-green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.25);
        }
        .btn-apply-green:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
        }
        .btn-apply-red {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 3px 10px rgba(220, 38, 38, 0.25);
        }
        .btn-apply-red:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(220, 38, 38, 0.35);
        }

        /* ==== Toast 通知 ==== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--toast-bg);
            color: #fff;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: var(--font-sans);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1), toastOut 0.35s ease 2.2s forwards;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 360px;
            pointer-events: auto;
        }
        .toast.success {
            background: linear-gradient(135deg, #065f46, #059669);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .toast.error {
            background: linear-gradient(135deg, #7f1d1d, #dc2626);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .toast .toast-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
        }

        /* ==== 底部 ==== */
        .footer-note {
            margin-top: 18px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid #eef2f8;
            padding-top: 18px;
            letter-spacing: 0.3px;
        }

        /* ==== 响应式 ==== */
        @media (max-width: 768px) {
            body {
                padding: 14px 10px;
            }
            .card {
                padding: 20px 16px;
                border-radius: var(--radius-lg);
            }
            h1 {
                font-size: 1.4rem;
                gap: 8px;
            }
            h1 .icon-wrap {
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
                border-radius: 12px;
            }
            .tab-btn {
                padding: 10px 14px;
                font-size: 0.82rem;
                gap: 4px;
            }
            .tab-btn.active::after {
                left: 12px;
                right: 12px;
            }
            .row-flex {
                gap: 12px;
            }
            .col {
                min-width: 140px;
            }
            button.primary {
                padding: 10px 24px;
                font-size: 0.82rem;
            }
            .secondary-btn {
                padding: 7px 14px;
                font-size: 0.75rem;
            }
            .result-area {
                max-height: 280px;
                padding: 14px;
                font-size: 0.78rem;
            }
            .batch-ctrl-group {
                padding: 14px 16px;
                border-radius: var(--radius-md);
            }
            .inline-input-group .field {
                min-width: 120px;
            }
            .toast-container {
                bottom: 16px;
                right: 16px;
                left: 16px;
                align-items: center;
            }
            .toast {
                max-width: 100%;
                padding: 12px 18px;
                font-size: 0.78rem;
            }
        }
        @media (max-width: 400px) {
            .tab-btn {
                padding: 8px 10px;
                font-size: 0.75rem;
            }
            .tab-btn .tab-icon {
                font-size: 0.9rem;
            }
            .check-group {
                gap: 8px;
            }
            .check-item {
                font-size: 0.75rem;
            }
            .action-btns {
                gap: 5px;
            }
            .secondary-btn {
                padding: 6px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>
                <span class="icon-wrap">✂️</span>
                文本处理工具箱
            </h1>
            <div class="sub">
                分割 · 合并 · 批量编辑
                <span class="tag">v2.0</span>
                <span class="tag">⚡ 实时处理</span>
            </div>

            <!-- Tab 导航 -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="split">
                    <span class="tab-icon">🔪</span> 分割工具
                </button>
                <button class="tab-btn" data-tab="merge">
                    <span class="tab-icon">🔗</span> 合并工具
                </button>
                <button class="tab-btn" data-tab="batch">
                    <span class="tab-icon">✏️</span> 批量编辑
                </button>
            </div>

            <!-- ================= 分割面板 ================= -->
            <div id="splitPane" class="tab-pane active">
                <label><span class="label-icon">📦</span> 原始文本</label>
                <textarea id="splitRawText" rows="4" placeholder="例如：ADD6953/93、ADD6954/93、ADD6955/93、ADD585/93、ADD6974/93、ADD6970/93、ADD8630/93、"></textarea>
                <div class="row-flex">
                    <div class="col sep-input">
                        <label><span class="label-icon">🔧</span> 分隔符</label>
                        <input type="text" id="splitSeparator" value="、">
                        <div class="quick-btns">
                            <span class="quick-label">常用</span>
                            <button type="button" class="quick-btn" data-target="split" data-sep="、">顿号 、</button>
                            <button type="button" class="quick-btn" data-target="split" data-sep=",">逗号 ,</button>
                            <button type="button" class="quick-btn" data-target="split" data-sep=" ">空格</button>
                            <button type="button" class="quick-btn" data-target="split" data-sep="|">竖线 |</button>
                            <button type="button" class="quick-btn" data-target="split" data-sep="\n">换行</button>
                        </div>
                    </div>
                    <div class="col">
                        <label><span class="label-icon">⚙️</span> 选项</label>
                        <div class="check-group">
                            <label class="check-item"><input type="checkbox" id="splitTrimItems"> ✨ 去首尾空格</label>
                            <label class="check-item"><input type="checkbox" id="splitFilterEmpty" checked> 🧹 过滤空白项</label>
                            <label class="check-item"><input type="checkbox" id="splitRegexMode"> 🧩 正则模式</label>
                        </div>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
                    <button id="splitDoBtn" class="primary">🔪 开始分割</button>
                </div>
                <div style="margin-top: 26px;">
                    <div class="result-header">
                        <span class="label-text">✅ 分割结果 <span style="font-size:0.7rem;color:var(--text-muted);font-weight:400;">(一行一个)</span></span>
                        <div class="stats" id="splitStats">等待分割</div>
                    </div>
                    <div class="action-bar">
                        <div class="action-btns">
                            <button id="splitCopyBtn" class="secondary-btn">📋 复制结果</button>
                            <button id="splitDownloadBtn" class="secondary-btn">💾 下载 .txt</button>
                            <button id="splitClearBtn" class="secondary-btn danger-btn">🗑️ 清空结果</button>
                        </div>
                    </div>
                    <div class="result-area"><pre id="splitResultPre">暂无结果</pre></div>
                </div>
            </div>

            <!-- ================= 合并面板 ================= -->
            <div id="mergePane" class="tab-pane">
                <label><span class="label-icon">📝</span> 多行文本 <span style="font-size:0.7rem;color:var(--text-muted);font-weight:400;">(每行作为合并项)</span></label>
                <textarea id="mergeRawText" rows="4" placeholder="苹果&#10;香蕉&#10;橘子"></textarea>
                <div class="row-flex">
                    <div class="col sep-input">
                        <label><span class="label-icon">🔗</span> 合并分隔符</label>
                        <input type="text" id="mergeSeparator" value="、">
                        <div class="quick-btns">
                            <span class="quick-label">常用</span>
                            <button type="button" class="quick-btn" data-target="merge" data-sep="、">顿号</button>
                            <button type="button" class="quick-btn" data-target="merge" data-sep=",">逗号</button>
                            <button type="button" class="quick-btn" data-target="merge" data-sep=" ">空格</button>
                            <button type="button" class="quick-btn" data-target="merge" data-sep="|">竖线</button>
                        </div>
                    </div>
                    <div class="col">
                        <label><span class="label-icon">⚙️</span> 选项</label>
                        <div class="check-group">
                            <label class="check-item"><input type="checkbox" id="mergeTrimLines"> ✨ 每行去空格</label>
                            <label class="check-item"><input type="checkbox" id="mergeFilterEmptyLines" checked> 🧹 忽略空白行</label>
                        </div>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
                    <button id="mergeDoBtn" class="primary">🔗 开始合并</button>
                </div>
                <div style="margin-top: 26px;">
                    <div class="result-header">
                        <span class="label-text">✅ 合并结果 <span style="font-size:0.7rem;color:var(--text-muted);font-weight:400;">(单行)</span></span>
                        <div class="stats" id="mergeStats">等待合并</div>
                    </div>
                    <div class="action-bar">
                        <div class="action-btns">
                            <button id="mergeCopyBtn" class="secondary-btn">📋 复制结果</button>
                            <button id="mergeDownloadBtn" class="secondary-btn">💾 下载 .txt</button>
                            <button id="mergeClearBtn" class="secondary-btn danger-btn">🗑️ 清空结果</button>
                        </div>
                    </div>
                    <div class="result-area"><pre id="mergeResultPre">暂无结果</pre></div>
                </div>
            </div>

            <!-- ================= 批量编辑面板 ================= -->
            <div id="batchPane" class="tab-pane">
                <label><span class="label-icon">📄</span> 源文本 <span style="font-size:0.7rem;color:var(--text-muted);font-weight:400;">(每行一条数据)</span></label>
                <textarea id="batchSource" rows="4" placeholder="每行一个项目，例如：&#10;apple&#10;banana&#10;cherry"></textarea>

                <!-- 添加前缀 -->
                <div class="batch-ctrl-group" style="margin-top:18px;">
                    <div class="group-title">
                        ➕ 批量添加前缀
                        <span class="group-badge badge-green">PREFIX</span>
                    </div>
                    <div class="inline-input-group">
                        <div class="field"><input type="text" id="batchPrefix" placeholder="例如：商品_"></div>
                        <div class="action-btn"><button id="applyPrefixBtn" class="btn-apply-green">添加前缀 →</button></div>
                    </div>
                </div>

                <!-- 添加后缀 -->
                <div class="batch-ctrl-group">
                    <div class="group-title">
                        🔚 批量添加后缀
                        <span class="group-badge badge-green">SUFFIX</span>
                    </div>
                    <div class="inline-input-group">
                        <div class="field"><input type="text" id="batchSuffix" placeholder="例如：.jpg"></div>
                        <div class="action-btn"><button id="applySuffixBtn" class="btn-apply-green">添加后缀 →</button></div>
                    </div>
                </div>

                <!-- 去除关键字 -->
                <div class="batch-ctrl-group">
                    <div class="group-title">
                        ❌ 批量去除指定关键字
                        <span class="group-badge badge-red">REMOVE</span>
                    </div>
                    <div class="inline-input-group">
                        <div class="field"><input type="text" id="batchKeyword" placeholder="要删除的关键字，例如：test_"></div>
                        <div class="action-btn"><button id="applyRemoveBtn" class="btn-apply-red">删除关键字 →</button></div>
                    </div>
                    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:14px;">
                        <label class="check-item">
                            <input type="checkbox" id="removeAllOccurrences" checked>
                            <span>删除所有出现 (否则仅第一个)</span>
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="caseSensitive" checked>
                            <span>区分大小写</span>
                        </label>
                    </div>
                </div>

                <!-- 辅助操作 -->
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 20px; flex-wrap: wrap;">
                    <button id="batchResetSource" class="secondary-btn">↺ 重置源文本</button>
                    <button id="batchClearAll" class="secondary-btn danger-btn">🗑️ 清空结果</button>
                </div>

                <!-- 结果区域 -->
                <div style="margin-top: 8px;">
                    <div class="result-header">
                        <span class="label-text">✨ 批量处理结果</span>
                        <div class="stats" id="batchStats">等待处理</div>
                    </div>
                    <div class="action-bar">
                        <div class="action-btns">
                            <button id="batchCopyResult" class="secondary-btn">📋 复制结果</button>
                            <button id="batchDownloadResult" class="secondary-btn">💾 下载 .txt</button>
                            <button id="batchSyncToSource" class="secondary-btn">⇄ 设为源文本</button>
                        </div>
                    </div>
                    <div class="result-area"><pre id="batchResultPre">暂无处理结果</pre></div>
                </div>
                <div class="footer-note">
                    💡 说明：前缀/后缀/删除关键字均基于「源文本」逐行处理。支持「设为源文本」进行链式编辑。
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // ---------- Toast 通知系统 ----------
            const toastContainer = document.getElementById('toastContainer');

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
                toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>`;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 2600);
            }

            // ---------- 复制辅助函数 ----------
            async function copyText(text, btnElement) {
                if (!text || text.includes('暂无') || text.includes('无结果') || text.includes('请输入') ||
                    text.includes('错误') || text.includes('已清空') || text.includes('无有效')) {
                    showToast('没有可复制的内容', 'error');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('已复制到剪贴板', 'success');
                    if (btnElement) {
                        btnElement.classList.add('copied');
                        const originalHTML = btnElement.innerHTML;
                        btnElement.innerHTML = '✅ 已复制';
                        setTimeout(() => {
                            btnElement.classList.remove('copied');
                            btnElement.innerHTML = originalHTML;
                        }, 1500);
                    }
                } catch (err) {
                    showToast('复制失败，请手动复制', 'error');
                }
            }

            // ---------- 下载辅助函数 ----------
            function downloadText(text, filename) {
                if (!text || text.includes('暂无') || text.includes('无结果') || text.includes('请输入') ||
                    text.includes('错误') || text.includes('已清空') || text.includes('无有效')) {
                    showToast('没有可下载的数据', 'error');
                    return;
                }
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                showToast('文件已开始下载', 'success');
            }

            // ---------- Tab 切换 ----------
            const tabBtns = document.querySelectorAll('.tab-btn');
            const panes = {
                split: document.getElementById('splitPane'),
                merge: document.getElementById('mergePane'),
                batch: document.getElementById('batchPane')
            };

            function switchTab(tabId) {
                Object.keys(panes).forEach(id => panes[id].classList.remove('active'));
                panes[tabId].classList.add('active');
                tabBtns.forEach(btn => {
                    if (btn.getAttribute('data-tab') === tabId) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            }
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-tab');
                    if (panes[id]) switchTab(id);
                });
            });

            // ==================== 分割模块 ====================
            const splitRaw = document.getElementById('splitRawText');
            const splitSep = document.getElementById('splitSeparator');
            const splitTrim = document.getElementById('splitTrimItems');
            const splitFilter = document.getElementById('splitFilterEmpty');
            const splitRegex = document.getElementById('splitRegexMode');
            const splitDo = document.getElementById('splitDoBtn');
            const splitPre = document.getElementById('splitResultPre');
            const splitStats = document.getElementById('splitStats');
            const splitCopy = document.getElementById('splitCopyBtn');
            const splitDownload = document.getElementById('splitDownloadBtn');
            const splitClear = document.getElementById('splitClearBtn');

            function execSplit() {
                const raw = splitRaw.value;
                if (!raw.trim()) {
                    splitPre.textContent = '（请输入文本）';
                    splitStats.textContent = '0 项';
                    return;
                }
                let sep = splitSep.value;
                const regexMode = splitRegex.checked;
                let parts;
                try {
                    if (regexMode) {
                        const reg = new RegExp(sep, 'g');
                        parts = raw.split(reg);
                    } else {
                        parts = sep === '' ? raw.split('') : raw.split(sep);
                    }
                    if (splitTrim.checked) parts = parts.map(p => p.trim());
                    if (splitFilter.checked) parts = parts.filter(p => p !== '');
                    splitPre.textContent = parts.join('\n');
                    splitStats.textContent = `${parts.length} 项`;
                } catch (e) {
                    splitPre.textContent = `错误: ${e.message}`;
                    splitStats.textContent = '错误';
                }
            }
            splitDo.addEventListener('click', execSplit);
            splitCopy.addEventListener('click', () => copyText(splitPre.textContent, splitCopy));
            splitDownload.addEventListener('click', () => downloadText(splitPre.textContent, 'split_result.txt'));
            splitClear.addEventListener('click', () => {
                splitPre.textContent = '（结果已清空）';
                splitStats.textContent = '0 项';
            });
            [splitRaw, splitSep, splitTrim, splitFilter, splitRegex].forEach(el => el.addEventListener('input', execSplit));
            if (splitRaw.value.trim() === '') splitRaw.value =
                'ADD6953/93、ADD6954/93、ADD6955/93、ADD585/93、ADD6974/93、ADD6970/93、ADD8630/93、';
            execSplit();

            document.querySelectorAll('.quick-btn[data-target="split"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    let s = btn.getAttribute('data-sep');
                    if (s === '\\n') s = '\n';
                    splitSep.value = s;
                    execSplit();
                });
            });

            // ==================== 合并模块 ====================
            const mergeRaw = document.getElementById('mergeRawText');
            const mergeSep = document.getElementById('mergeSeparator');
            const mergeTrimLines = document.getElementById('mergeTrimLines');
            const mergeFilterEmpty = document.getElementById('mergeFilterEmptyLines');
            const mergeDo = document.getElementById('mergeDoBtn');
            const mergePre = document.getElementById('mergeResultPre');
            const mergeStatsSpan = document.getElementById('mergeStats');
            const mergeCopy = document.getElementById('mergeCopyBtn');
            const mergeDownload = document.getElementById('mergeDownloadBtn');
            const mergeClear = document.getElementById('mergeClearBtn');

            function execMerge() {
                const text = mergeRaw.value;
                if (!text.trim()) {
                    mergePre.textContent = '（请输入多行文本）';
                    mergeStatsSpan.textContent = '0 项';
                    return;
                }
                let lines = text.split(/\r?\n/);
                if (mergeTrimLines.checked) lines = lines.map(l => l.trim());
                if (mergeFilterEmpty.checked) lines = lines.filter(l => l !== '');
                if (lines.length === 0) {
                    mergePre.textContent = '（无有效行）';
                    mergeStatsSpan.textContent = '0 项';
                    return;
                }
                const sep = mergeSep.value;
                const result = lines.join(sep);
                mergePre.textContent = result;
                mergeStatsSpan.textContent = `${lines.length} 行 → ${result.length} 字符`;
            }
            mergeDo.addEventListener('click', execMerge);
            mergeCopy.addEventListener('click', () => copyText(mergePre.textContent, mergeCopy));
            mergeDownload.addEventListener('click', () => downloadText(mergePre.textContent, 'merged.txt'));
            mergeClear.addEventListener('click', () => {
                mergePre.textContent = '（结果已清空）';
                mergeStatsSpan.textContent = '0 项';
            });
            [mergeRaw, mergeSep, mergeTrimLines, mergeFilterEmpty].forEach(el => el.addEventListener('input',
            execMerge));
            if (mergeRaw.value.trim() === '') mergeRaw.value = '苹果\n香蕉\n橘子\n葡萄';
            execMerge();

            document.querySelectorAll('.quick-btn[data-target="merge"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    mergeSep.value = btn.getAttribute('data-sep');
                    execMerge();
                });
            });

            // ==================== 批量编辑模块 ====================
            const batchSource = document.getElementById('batchSource');
            const batchPrefixInput = document.getElementById('batchPrefix');
            const batchSuffixInput = document.getElementById('batchSuffix');
            const batchKeywordInput = document.getElementById('batchKeyword');
            const removeAllOccur = document.getElementById('removeAllOccurrences');
            const caseSensitive = document.getElementById('caseSensitive');
            const applyPrefix = document.getElementById('applyPrefixBtn');
            const applySuffix = document.getElementById('applySuffixBtn');
            const applyRemove = document.getElementById('applyRemoveBtn');
            const batchResultPre = document.getElementById('batchResultPre');
            const batchStats = document.getElementById('batchStats');
            const batchCopyResult = document.getElementById('batchCopyResult');
            const batchDownloadResult = document.getElementById('batchDownloadResult');
            const batchResetSource = document.getElementById('batchResetSource');
            const batchClearAll = document.getElementById('batchClearAll');
            const batchSyncToSource = document.getElementById('batchSyncToSource');

            function getSourceLines() {
                const raw = batchSource.value;
                if (raw === '') return [];
                return raw.split(/\r?\n/);
            }

            function setResult(linesArray) {
                if (!linesArray || linesArray.length === 0) {
                    batchResultPre.textContent = '（无结果）';
                    batchStats.textContent = '0 行';
                    return;
                }
                batchResultPre.textContent = linesArray.join('\n');
                batchStats.textContent = `${linesArray.length} 行`;
            }

            function addPrefix() {
                const prefix = batchPrefixInput.value;
                const lines = getSourceLines();
                if (lines.length === 0) { showToast('源文本为空，请先输入数据', 'error'); return; }
                setResult(lines.map(line => prefix + line));
                showToast(`已为 ${lines.length} 行添加前缀`, 'success');
            }

            function addSuffix() {
                const suffix = batchSuffixInput.value;
                const lines = getSourceLines();
                if (lines.length === 0) { showToast('源文本为空', 'error'); return; }
                setResult(lines.map(line => line + suffix));
                showToast(`已为 ${lines.length} 行添加后缀`, 'success');
            }

            function removeKeyword() {
                const keyword = batchKeywordInput.value;
                if (keyword === '') { showToast('请输入要删除的关键字', 'error'); return; }
                const lines = getSourceLines();
                if (lines.length === 0) { showToast('源文本为空', 'error'); return; }
                const caseFlag = caseSensitive.checked;
                const globalFlag = removeAllOccur.checked;
                const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const newLines = lines.map(line => {
                    if (line === '') return line;
                    if (!caseFlag) {
                        const flags = globalFlag ? 'gi' : 'i';
                        const regex = new RegExp(escapedKeyword, flags);
                        return line.replace(regex, '');
                    } else {
                        if (globalFlag) {
                            const regex = new RegExp(escapedKeyword, 'g');
                            return line.replace(regex, '');
                        } else {
                            return line.replace(keyword, '');
                        }
                    }
                });
                setResult(newLines);
                showToast(`已删除关键字「${keyword}」`, 'success');
            }

            applyPrefix.addEventListener('click', addPrefix);
            applySuffix.addEventListener('click', addSuffix);
            applyRemove.addEventListener('click', removeKeyword);

            batchCopyResult.addEventListener('click', () => copyText(batchResultPre.textContent, batchCopyResult));
            batchDownloadResult.addEventListener('click', () => downloadText(batchResultPre.textContent,
                `batch_edit_${Date.now()}.txt`));

            batchResetSource.addEventListener('click', () => {
                batchSource.value = 'apple\nbanana\ncherry\ndragonfruit';
                batchPrefixInput.value = '';
                batchSuffixInput.value = '';
                batchKeywordInput.value = '';
                batchResultPre.textContent = '（源文本已重置，请进行批量操作）';
                batchStats.textContent = '0 行';
                showToast('源文本已重置', 'success');
            });

            batchClearAll.addEventListener('click', () => {
                batchResultPre.textContent = '（结果已清空）';
                batchStats.textContent = '0 行';
            });

            batchSyncToSource.addEventListener('click', () => {
                const resultText = batchResultPre.textContent;
                if (resultText && !resultText.includes('无结果') && !resultText.includes('已清空') && !resultText.includes(
                        '暂无')) {
                    batchSource.value = resultText;
                    batchResultPre.textContent = '（已将结果同步到源文本，可继续编辑）';
                    batchStats.textContent = '0 行';
                    showToast('已同步，可继续链式编辑', 'success');
                } else {
                    showToast('结果区无有效内容，无法同步', 'error');
                }
            });

            if (batchSource.value.trim() === '') batchSource.value = 'apple\nbanana\ncherry\n测试关键字行';
        })();
    </script>
</body>
</html>
